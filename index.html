<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Worms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #16213f;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Baloo 2', sans-serif;
      }
      #game-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .mobile-team-form {
        position: absolute;
        left: 50%;
        bottom: max(22px, env(safe-area-inset-bottom));
        z-index: 10;
        display: grid;
        gap: 10px;
        width: min(86vw, 420px);
        transform: translateX(-50%);
        pointer-events: auto;
      }
      .mobile-team-form input,
      .mobile-team-form button {
        box-sizing: border-box;
        width: 100%;
        border: 2px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        font:
          700 18px 'Baloo 2',
          sans-serif;
      }
      .mobile-team-form input {
        padding: 10px 12px;
        color: #fff8e7;
        background: rgba(15, 23, 46, 0.84);
        outline: none;
      }
      .mobile-team-form .worm-row {
        display: flex;
        gap: 10px;
      }
      .mobile-team-form .worm-row input {
        flex: 1 1 0;
        width: auto;
        font-size: 16px;
      }
      .mobile-team-form input:focus {
        border-color: #ffd966;
      }
      .mobile-team-form button {
        padding: 10px 12px;
        color: #16213f;
        background: #ffd966;
      }
      .mobile-game-controls {
        position: absolute;
        left: 50%;
        bottom: max(10px, env(safe-area-inset-bottom));
        z-index: 10;
        display: grid;
        grid-template-columns: auto minmax(130px, 1fr) auto auto;
        gap: 8px;
        align-items: center;
        width: min(94vw, 560px);
        transform: translateX(-50%);
        pointer-events: auto;
      }
      .mobile-game-controls button,
      .mobile-game-controls output {
        box-sizing: border-box;
        min-height: 42px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #fff8e7;
        background: rgba(15, 23, 46, 0.82);
        font:
          800 15px 'Baloo 2',
          sans-serif;
        touch-action: manipulation;
      }
      .mobile-game-controls output {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 10px;
        text-align: center;
      }
      .mobile-game-controls button {
        padding: 8px 10px;
      }
      .mobile-game-controls .mobile-end-turn {
        color: #16213f;
        background: #ffd966;
      }
      .music-controls {
        position: absolute;
        top: max(6px, env(safe-area-inset-top));
        right: 8px;
        z-index: 10;
        display: flex;
        gap: 6px;
        align-items: center;
        pointer-events: auto;
      }
      .music-controls button {
        box-sizing: border-box;
        min-height: 26px;
        padding: 4px 8px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: #fff8e7;
        background: rgba(15, 23, 46, 0.82);
        font:
          700 12px 'Baloo 2',
          sans-serif;
        touch-action: manipulation;
      }
      .music-controls button:disabled {
        opacity: 0.4;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
